[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feedwatch"
version = "0.1.0"
description = "RSS aggregator with semantic search and AI agents"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "vadersentiment>=3.3",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "anthropic>=0.30",
    "apscheduler>=3.10",
]

[project.scripts]
feedwatch = "feedwatch.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
